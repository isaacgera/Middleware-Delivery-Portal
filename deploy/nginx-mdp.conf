# nginx reverse proxy for MDP — TLS termination + forward to the loopback Node app.
# Use this if the BT server runs nginx (Linux, or nginx-on-Windows). Replace every <...>.
#
# Install: drop this in the nginx conf.d/sites-available dir, symlink/enable it, `nginx -t`, reload.
# MDP must be running on 127.0.0.1:4000 (its default) as a service — see run-as-service-windows.md
# (Linux: a systemd unit doing `node server/server.js` with NODE_ENV=production).

# --- Redirect all HTTP to HTTPS ---
server {
    listen 80;
    server_name <mdp.hostname.bt.com>;
    # Allow ACME/cert renewal challenges if applicable, else redirect everything.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: terminate TLS here, proxy to the Node app on loopback ---
server {
    listen 443 ssl;
    server_name <mdp.hostname.bt.com>;

    # BT-issued certificate + key (PEM). Keep the key readable only by the nginx user.
    ssl_certificate     <path/to/mdp.crt>;
    ssl_certificate_key <path/to/mdp.key>;

    # Sensible modern TLS (adjust to BT policy).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Optional hardening (enable once the cert chain is stable):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Menu Card .xlsx uploads can be a few MB; the app guards at 15 MB — allow headroom.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Preserve host + client info so the app and its Secure cookie behave correctly.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # tells the app it's behind HTTPS

        proxy_read_timeout 60s;
    }

    # Optional: a quick health probe target for monitoring (same app endpoint).
    location = /api/health {
        proxy_pass http://127.0.0.1:4000/api/health;
        access_log off;
    }
}
